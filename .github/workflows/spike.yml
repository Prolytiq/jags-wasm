# Phase 0/1 spike: JAGS cross-compiles to wasm (Phase 0 DONE — libjags.a + 8 modules);
# Phase 1 attempts the rjags R package build against the prefix.
name: jags-wasm-spike
on:
  push: { branches: [main] }
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-libjags:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/r-wasm/webr:main
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Toolchain probe
        run: |
          which emcc em++ node
          emcc --version | head -1
          echo "=== fortran compilers anywhere ==="
          find / -maxdepth 4 \( -iname "*flang*" -o -iname "f77" -o -iname "gfortran*" \) 2>/dev/null | grep -v proc | head -30
          echo "=== /opt tree ==="
          ls /opt; ls /opt/webr 2>/dev/null; ls /opt/webr/wasm 2>/dev/null
          which flang-new || true
          # find the wasm R's Makeconf and print its toolchain lines (source of truth)
          MC=$(ls /opt/R/wasm/lib/R/etc/Makeconf 2>/dev/null || find /opt -name Makeconf -path "*wasm*etc*" 2>/dev/null | head -1)
          echo "Makeconf: $MC"
          echo "=== wasm R libs (blas/lapack candidates) ==="
          find /opt/webr/wasm -name "libRlapack*" -o -name "libRblas*" 2>/dev/null | head -10
          grep -E "^(CC|CXX|FC|F77|FLIBS|CFLAGS|CXXFLAGS|FCFLAGS|FFLAGS|LDFLAGS|CPPFLAGS|DYLIB_LD|MAIN_LD|SHLIB_LD) *=" "$MC" || true
      - name: Build netlib BLAS+LAPACK static for wasm
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/blas.tgz "https://netlib.org/blas/blas.tgz"
          curl -fsSL -o /tmp/lapackgh.tgz "https://github.com/Reference-LAPACK/lapack/archive/refs/tags/v3.12.0.tar.gz"
          tar xzf /tmp/blas.tgz -C /tmp && tar xzf /tmp/lapackgh.tgz -C /tmp
          FL=/opt/flang/host/bin/flang
          FFLAGS="-O2 --target=wasm32-unknown-emscripten -fPIC"
          AR=emar RANLIB=emranlib
          # BLAS: pure Fortran sources -> static archive
          cd /tmp/BLAS-3.12.0
          $FL $FFLAGS -c *.f
          emar cr libblas.a *.o && emranlib libblas.a
          # LAPACK: plain make (cmake chokes on enable_language(Fortran) cross-compiling)
          cd /tmp/lapack-3.12.0
          cp make.inc.example make.inc
          sed -i 's|^FC  *= .*|FC = /opt/flang/host/bin/flang|; s|^FFLAGS  *= .*|FFLAGS = -O2 --target=wasm32-unknown-emscripten -fPIC|; s|^FFLAGS_NOOPT  *= .*|FFLAGS_NOOPT = -O0 --target=wasm32-unknown-emscripten -fPIC|; s|^LOADER   *= .*|LOADER = /opt/flang/host/bin/flang|; s|^ARCH     *= .*|ARCH = emar|; s|^RANLIB   *= .*|RANLIB = emranlib|' make.inc
          make lapacklib -j2 2>&1 | tail -5
          cp liblapack.a /tmp/lapack-wasm-liblapack.a
          mkdir -p /tmp/lapack-wasm/lib
          mv /tmp/lapack-wasm-liblapack.a /tmp/lapack-wasm/lib/liblapack.a
          ls -la /tmp/lapack-wasm/lib /tmp/BLAS-3.12.0/libblas.a
      - name: Inspect webr flang tooling
        run: |
          echo "=== /opt/flang ==="; ls -la /opt/flang 2>/dev/null || echo absent
          echo "=== fortran-flang.mk ==="; head -60 /opt/webr/tools/fortran-flang.mk 2>/dev/null
          echo "=== tools dir ==="; ls /opt/webr/tools 2>/dev/null
          echo "=== Makefile targets ==="; grep -E "^[a-z-]+:" /opt/webr/Makefile | head -20
      - name: Download JAGS source
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/jags.tar.gz \
            "https://downloads.sourceforge.net/project/mcmc-jags/JAGS/4.x/Source/JAGS-4.3.1.tar.gz"
          tar xzf /tmp/jags.tar.gz -C /tmp
      - name: Refresh autotools config (recognize wasm32-unknown-emscripten)
        run: |
          set -euo pipefail
          # local autoconf copy first (no network flakiness); GNU savannah as fallback
          if [ -f /usr/share/misc/config.sub ]; then
            cp /usr/share/misc/config.sub /tmp/JAGS-4.3.1/config.sub
            cp /usr/share/misc/config.guess /tmp/JAGS-4.3.1/config.guess
          else
            curl -fsSL --retry 3 -o /tmp/JAGS-4.3.1/config.sub "https://raw.githubusercontent.com/gcc-mirror/gcc/master/config.sub"
            curl -fsSL --retry 3 -o /tmp/JAGS-4.3.1/config.guess "https://raw.githubusercontent.com/gcc-mirror/gcc/master/config.guess"
          fi
          grep -q emscripten /tmp/JAGS-4.3.1/config.sub || { echo "config.sub still does not know emscripten"; exit 1; }
      - name: Patch JAGS for C++17 (std::binary_function/bind2nd removed in C++17)
        run: patch -p1 -d /tmp < "$GITHUB_WORKSPACE/patches/disttab-cxx17.patch"
      - name: Modernize remaining C++17 removals across src/ (binary_function, bind2nd)
        run: |
          find /tmp/JAGS-4.3.1/src -name "*.cc" -o -name "*.h" -o -name "*.cpp" | while read f; do
            perl -0pi -e 's/using std::binary_function;\n//g' "$f"
            perl -0pi -e 's/: public binary_function<[^>]*>//g' "$f"
            perl -pi -e 's/bind2nd\((\w+\(\)), /std::bind($1, std::placeholders::_1, /g' "$f"
          done
          grep -rn "binary_function\|bind2nd" /tmp/JAGS-4.3.1/src --include="*.cc" | head -5 || echo "clean"
      - name: Configure JAGS for emscripten
        working-directory: /tmp/JAGS-4.3.1
        run: |
          set -euo pipefail
          # Actions run: uses a non-login shell — load the container's env profile
          source /etc/profile 2>/dev/null || true
          ls /etc/profile.d/ 2>/dev/null || true
          for f in /etc/profile.d/*.sh; do source "$f" 2>/dev/null || true; done
          env | grep -iE "em|flang|wasm" | head -20 || true
          # lift the whole toolchain out of the WASM R Makeconf (explicit path — the
          # container also has a native R whose Makeconf says gcc; found it the hard way)
          MC=$(ls /opt/R/wasm/lib/R/etc/Makeconf 2>/dev/null || find /opt -name Makeconf -path "*wasm*etc*" 2>/dev/null | head -1)
          test -n "$MC"
          # strip $(MAKE_VAR) tokens — Makeconf flags carry them for R's package builds;
          # outside make, emcc would treat them as input files ("$(LTO): No such file")
          val() { grep -E "^$1 *=" "$MC" | head -1 | sed "s/^$1 *= *//" | sed 's/\$([^)]*)//g' ; }
          export CC="$(val CC)" CXX="$(val CXX)" AR="$(val AR)" RANLIB="$(val RANLIB)"
          # the wasm R Makeconf has no F77 (its Fortran comes prebuilt in libFortranRuntime.a);
          # JAGS must COMPILE Fortran, so point at the container's wasm flang
          export F77="$(val F77)" FC="$(val FC)" FLIBS="$(val FLIBS)"
          if [ -z "$F77" ]; then
            # webr's fortran-flang.mk: EMFC = $(HOST)/bin/flang — the host flang that emits wasm
            FL=$(ls /opt/flang/host/bin/flang 2>/dev/null || find /opt/flang -name "flang" -type f 2>/dev/null | head -1)
            echo "flang binary: $FL"
            ls -la /opt/flang/host/bin 2>/dev/null | head
            if [ -n "$FL" ]; then
              export F77="$FL" FC="$FL"
              export FFLAGS="$(val FFLAGS) -O2 -fwasm-exceptions" FCFLAGS="$(val FCFLAGS) -O2 -fwasm-exceptions"
            fi
          fi
          echo "F77=$F77"
          # everything ends up inside the rjags.so side module: ALL objects need PIC,
          # but libtool strips -fPIC for static archives — force it here
          export CFLAGS="$(val CFLAGS) -fPIC" CXXFLAGS="$(val CXXFLAGS) -fPIC" FFLAGS="$(val FFLAGS) -fPIC" FCFLAGS="$(val FCFLAGS) -fPIC" LDFLAGS="$(val LDFLAGS)"
          echo "CC=$CC"; echo "F77=$F77"; echo "FLIBS=$FLIBS"
          # JAGS hard-requires BLAS+LAPACK; use the wasm R's own copies
          # the wasm R's own blas/lapack — find the real dir (R build layout varies)
          RLIBDIR=/tmp/lapack-wasm/lib
          test -f "$RLIBDIR/liblapack.a" || { echo "static lapack missing"; exit 1; }
          echo "RLIBDIR=$RLIBDIR"; ls -la "$RLIBDIR" | head -8
          # do NOT export LIBS globally: it leaks into the CC sanity check and fails it.
          # The blas/lapack paths go to configure via --with-* flags only (used after the CC check).
          ./configure --host=wasm32-unknown-emscripten \
            --prefix=/tmp/jags-wasm-install \
            --disable-dependency-tracking \
            --with-blas="-L/tmp/BLAS-3.12.0 -lblas" \
            --with-lapack="-L$RLIBDIR -llapack" \
            2>&1 | tee configure.log
      - name: Build
        working-directory: /tmp/JAGS-4.3.1
        run: |
          set -euo pipefail
          # libjags + jrmath + all 8 modules compile to wasm. The jags-terminal binary
          # does NOT link (libtool dlpreopen is incompatible with emscripten) — and is
          # not needed: rjags uses libjags + modules directly (Phase 1).
          make -C libltdl -j2 2>&1 | tail -3
          make -C src/jrmath -j2 2>&1 | tail -3
          make -C src/lib -j2 2>&1 | tail -3
          make -C src/modules -j2 2>&1 | tail -3
      - name: Install to prefix (libjags, modules, headers)
        working-directory: /tmp/JAGS-4.3.1
        run: |
          set -euo pipefail
          P=/tmp/jags-wasm-install
          mkdir -p $P/lib/jags/modules $P/include
          cp -r src/include/* $P/include/
          cp src/lib/.libs/libjags.a $P/lib/
          cp src/jrmath/.libs/libjrmath.a $P/lib/
          find src/modules -name "*.a" -path "*.libs*" -exec cp {} $P/lib/jags/modules/ \;
          # Phase 1c: link each module as an emscripten SIDE MODULE (.so) — rjags's
          # libltdl searches the module dir for <name>.so at runtime
          # netlib lapack ships its own lsame/xerbla which collide with BLAS's
          emar d /tmp/lapack-wasm/lib/liblapack.a lsame.o xerbla.o xerbla_array.o 2>/dev/null || true
          for a in src/modules/*/.libs/lib*.a; do
            n=$(basename $a .a)
            # embed BLAS/LAPACK INSIDE each module: importing dtrmm_/dgemm_ from R's
            # libRblas fails on ABI (signature mismatch); internal copies bind statically
            em++ -s SIDE_MODULE=1 -s WASM_BIGINT -s ASSERTIONS=1 -fwasm-exceptions -s SUPPORT_LONGJMP=wasm -Oz \
              -Wl,--whole-archive "$a" /tmp/BLAS-3.12.0/libblas.a /tmp/lapack-wasm/lib/liblapack.a /opt/flang/wasm/lib/libFortranRuntime.a -Wl,--no-whole-archive \
              -o "$P/lib/jags/modules/${n}.so" 2>&1 | tail -2 || echo "side module $n FAILED"
          done
          ls -la $P/lib/jags/modules/ | head -25
          find /tmp/JAGS-4.3.1/libltdl -name "libltdl*.a" 2>/dev/null | head -3
          find /tmp/JAGS-4.3.1/libltdl -name "libltdl*.a" -exec cp {} $P/lib/ \; 2>/dev/null || true
          ls -la $P/lib $P/lib/jags/modules | head -20
      - name: Phase 1 — build rjags against the wasm libjags (rwasm::build, static Makevars)
        run: |
          set -euo pipefail
          # host R drives the wasm build via rwasm (same machinery build-rwasm uses)
          # rwasm is preinstalled in the webr image; only try CRAN as a fallback
          Rscript -e 'if (!requireNamespace("rwasm", quietly = TRUE)) install.packages("rwasm", repos = c("https://r-wasm.r-universe.dev", "https://cran.r-project.org"))' 2>&1 | tail -2
          curl -fsSL -o /tmp/rjags.tar.gz "https://cran.r-project.org/src/contrib/rjags_4-16.tar.gz" || \
            curl -fsSL -o /tmp/rjags.tar.gz "https://cran.r-project.org/src/contrib/Archive/rjags/rjags_4-16.tar.gz"
          cd /tmp && tar xzf rjags.tar.gz
          # modified rjags tarball: configure removed, static Makevars pointing at our prefix
          cd /tmp/rjags
          # rjags keeps its configure at the package ROOT; without it, R uses our
          # static src/Makevars directly (paths are known — no detection needed)
          rm -f configure configure.ac configure.in
          # generate R/unix/zzz.R from the template (configure would normally do it):
          # without this the installed package has no .onLoad and never loads the DLL
          sed 's|@JAGS_MODDIR@|/tmp/jags-wasm-install/lib/jags/modules|' R/unix/zzz.R.in > R/unix/zzz.R
          cat > src/Makevars <<'MKV'
          PKG_CPPFLAGS = -I/tmp/jags-wasm-install/include
                    # No -llapack/-lblas: R already links libRlapack/libRblas into the process and
          # the rjags.so side module binds LAPACK/BLAS symbols against them at load time.
          # --whole-archive: import-dynamic would otherwise turn libjags's unresolved
          # symbols into dynamic imports and skip pulling archive members entirely.
          PKG_LIBS = -Wl,--whole-archive /tmp/jags-wasm-install/lib/libjags.a /tmp/jags-wasm-install/lib/libjrmath.a -Wl,--no-whole-archive -L/tmp/jags-wasm-install/lib -lltdlc /opt/flang/wasm/lib/libFortranRuntime.a
          LDFLAGS = -s MAIN_MODULE=1 -s WASM_BIGINT -s ASSERTIONS=1 -fwasm-exceptions -s SUPPORT_LONGJMP=wasm -Oz
          # webr-vars.mk hides visibility, which lets the linker GC R_init_rjags
          # (nothing references it internally) — R's registration then never runs.
          C_VISIBILITY =
          CXX_VISIBILITY =
          MKV
          # --- rota B: link the JAGS modules statically into rjags.so -------------
          # dlopen between side modules does not resolve (imports of a later
          # side module are not satisfied by an earlier one in R.wasm's linker).
          # JAGS's load.module short-circuits when the module is already in the
          # static registry (list.modules()), so: compile the modules' sources,
          # auto-discover their make*Module() factories, call them from a glue
          # hook run by R_init_rjags.
          MODSRC=$(ls -d /tmp/JAGS-*/src/modules | head -1)
          JAGSTOP=$(dirname "$(dirname "$MODSRC")")
          EXTRA_INC=""
          HDRS=$(find "$JAGSTOP" \( -name "cholmod.h" -o -name "matexp.h" -o -name "matrix.h" -o -name "SuiteSparse_config.h" \) 2>/dev/null)
          for f in $HDRS; do EXTRA_INC="$EXTRA_INC -I$(dirname "$f")"; done
          echo "extra includes: $EXTRA_INC"
          grep -c "F77_DSYEV" "$JAGSTOP/config.h" || echo "F77_DSYEV not in config.h"
          ALLDIRS=$(find "$MODSRC" -type d 2>/dev/null | sed 's/^/-I/' | tr '\n' ' ')
          MODINC="-I$MODSRC -I$JAGSTOP -I$JAGSTOP/src/lib -I$JAGSTOP/src/include -I/tmp/jags-wasm-install/include $EXTRA_INC $ALLDIRS"
          echo "=== debug: JAGS tree ==="
          ls -la "$JAGSTOP"/config.h 2>&1 || true
          echo "--- src/:"; ls "$JAGSTOP/src" 2>&1 | head -12
          echo "--- src/modules/:"; ls "$JAGSTOP/src/modules" 2>&1 | head -12
          echo "--- MODSRC=$MODSRC"
          MODOBJS=""
          for m in base bugs dic glm lecuyer mix msm; do
            (cd "$MODSRC/$m" && find . \( -name "*.cc" -o -name "*.cpp" \) -not -path "*test*" -exec emcc -std=gnu++20 -fPIC -Oz -DHAVE_CONFIG_H -include "$JAGSTOP/config.h" $MODINC -I. -c {} \; 2>&1 | grep -E "error|Error" | head -3) || true
          done
          MODOBJS=$(find "$MODSRC"/base "$MODSRC"/bugs "$MODSRC"/dic "$MODSRC"/glm "$MODSRC"/lecuyer "$MODSRC"/mix "$MODSRC"/msm -name "*.o" 2>/dev/null | tr '\n' ' ')
          echo "module objects: $(echo $MODOBJS | wc -w)"
          # discover the factories: extern "C" void make<Name>Module() in each module dir
          FACTIONS=$(grep -rhoE "make[A-Za-z]+Module" "$MODSRC"/base "$MODSRC"/bugs "$MODSRC"/dic "$MODSRC"/glm "$MODSRC"/lecuyer "$MODSRC"/mix "$MODSRC"/msm --include="*.cc" --include="*.h" --include="*.cpp" 2>/dev/null | sort -u) || FACTIONS=""
          echo "=== base.cc (first 45 lines) ==="
          head -45 "$MODSRC/base/base.cc"
          echo "=== base.cc tail (factory) ==="
          tail -25 "$MODSRC/base/base.cc"
          echo "=== grep make in all modules ==="
          grep -rn "make.*Module\|extern \"C\"" "$MODSRC"/{base,bugs,dic,glm,lecuyer,mix,msm} --include="*.cc" 2>/dev/null | grep -v "//" | head -12
          echo "factories discovered: $FACTIONS"
          { echo '#include <cstddef>'; for f in $FACTIONS; do echo "extern \"C\" void $f();"; done; \
            echo 'extern "C" void initJagsStaticModules() {'; for f in $FACTIONS; do echo "  $f();"; done; echo '}'; } > /tmp/static_modules.cc
          cat /tmp/static_modules.cc
          emcc -std=gnu++20 -fPIC -Oz -DHAVE_CONFIG_H $MODINC -c /tmp/static_modules.cc -o /tmp/static_modules.o
          # call it from R_init_rjags: patch the registration source
          RINIT=$(grep -rl "R_init_rjags" /tmp/rjags/src | head -1)
          echo "patching $RINIT"
          python3 - "$RINIT" <<'RIP'
          import sys, re
          p = sys.argv[1]
          s = open(p).read()
          glue = 'extern "C" void initJagsStaticModules();'
          if 'initJagsStaticModules' not in s:
              m = re.search(r'void R_init_rjags\s*\(', s)
              brace = s.index('{', m.start())
              s = s[:m.start()] + glue + '\n' + s[m.start():brace+1] + '\n  initJagsStaticModules();' + s[brace+1:]
              open(p, 'w').write(s)
          print('patched R_init_rjags')
          RIP
          # append the module objects to the link
          sed -i "s|PKG_LIBS = -Wl,--whole-archive|PKG_LIBS = $MODOBJS /tmp/static_modules.o -Wl,--whole-archive|" src/Makevars
          grep "PKG_LIBS" src/Makevars | head -c 400; echo
          # ---------------------------------------------------------------------
          cd /tmp && tar czf rjags-mod.tar.gz rjags
          # own driver: same cross-compilation env as rwasm, but tolerant to the
          # tarball name and capturing the .so directly (see patches/rjags-build.R)
          Rscript "$GITHUB_WORKSPACE/patches/rjags-build.R" 2>&1 | tail -60
          file /tmp/rjags-out/* 2>/dev/null || true
          echo "=== module sources still present? ==="
          ls "$MODSRC" 2>&1 | head -4
      - name: Phase 1 smoke test — library(rjags) inside WebR (Node)
        run: |
          set -euo pipefail
          cat > /tmp/smoke.mjs <<'SMK'
          import { WebR } from 'webr';
          import fs from 'fs';
          const webR = new WebR();
          await webR.init();
          const shelter = await new webR.Shelter();
          await webR.FS.writeFile('/tmp/rjags-bin.tar.gz', fs.readFileSync('/tmp/rjags-out/rjags_4-16_R_x86_64-pc-linux-gnu.tar.gz'));
          await webR.evalR('dir.create("/tmp/jags-wasm-install/lib/jags/modules", recursive = TRUE)');
          for (const f of fs.readdirSync('/tmp/jags-wasm-install/lib/jags/modules')) {
            if (f.endsWith('.so')) {
              const bytes = fs.readFileSync('/tmp/jags-wasm-install/lib/jags/modules/' + f);
              await webR.FS.writeFile('/tmp/jags-wasm-install/lib/jags/modules/' + f, bytes);
              const alias = f.replace(/^lib/, '');
              if (alias !== f) await webR.FS.writeFile('/tmp/jags-wasm-install/lib/jags/modules/' + alias, bytes);
            }
          }
          const out = (kind, text) => { const t = String(text).slice(0, 1500); if (t.trim()) console.log(kind + ': ' + t); };
          const run = async (label, code) => {
            const o = await shelter.captureR(code, { captureConditions: true, captureStreams: true, captureMessage: true });
            for (const e of o.output) out(label + ' [' + e.type + ']', typeof e.data === 'string' ? e.data : '');
            if (o.error) out(label + ' [ERROR]', '');
            console.log(label + ' => done');
          };
          await run('setup', 'webr::install("coda", repos = "https://prolytiq.github.io/r-wasm-pkgs/", quiet = TRUE); untar("/tmp/rjags-bin.tar.gz", exdir = "/tmp/rjags-lib", tar = "internal"); .libPaths(c("/tmp/rjags-lib", .libPaths()))');
          await run('libs listing', 'cat(toString(list.files("/tmp/rjags-lib/rjags/libs", recursive=TRUE, all.files=TRUE)))');
          await run('so size', 'cat(file.info("/tmp/rjags-lib/rjags/libs/rjags.so")$size)');
          await run('dyn.load rjags', 'd <- dyn.load("/tmp/rjags-lib/rjags/libs/rjags.so"); cat("rjags dyn.load OK")');
          await run('load rjags + load module', 'suppressWarnings(library(rjags)); rjags::load.module("base")');
          await run('toy mcmc', 'm <- rjags::jags.model(textConnection("model { y ~ dnorm(0,1) }"), data = list(), n.chains = 1); rjags::update(m, 100); p <- rjags::jags.samples(m, c("y"), 500); cat("y mean:", mean(p$y))');
          process.exit(0);
          SMK
          cd /tmp && npm init -y >/dev/null 2>&1; npm install webr@0.6.0 >/dev/null 2>&1
          node /tmp/smoke.mjs 2>&1 | tail -40 || true
      - name: Collect artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jags-wasm-artifacts
          path: |
            /tmp/JAGS-4.3.1/config.log
            /tmp/JAGS-4.3.1/configure.log
            /tmp/JAGS-4.3.1/build.log
            /tmp/jags-wasm-install/
            /tmp/rjags-out/
          if-no-files-found: ignore

  deploy-wasm-repo:
    needs: build-libjags
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download JAGS stack artifacts
        uses: actions/download-artifact@v4
        with:
          name: jags-wasm-artifacts
          path: /tmp/stack
      - name: Setup R (for PACKAGES index regeneration)
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - name: Install gemtc deps natively (lazy-load executes them at build)
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq libglpk-dev jags >/dev/null
          Rscript -e 'install.packages(c("igraph","meta","coda","plyr","Rglpk","forcats","slam","rjags"), repos="https://cran.r-project.org", quiet=TRUE)' 2>&1 | tail -2
      - name: Download gemtc source
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gemtc.tar.gz "https://cran.r-project.org/src/contrib/gemtc_1.1-2.tar.gz" || \
            curl -fsSL -o /tmp/gemtc.tar.gz "https://cran.r-project.org/src/contrib/Archive/gemtc/gemtc_1.1-2.tar.gz"
          rm -rf /tmp/gemtc && tar xzf /tmp/gemtc.tar.gz -C /tmp
      - name: Build GLPK + Rglpk (wasm, in the webr container)
        run: |
          set -euo pipefail
          cat > /tmp/glpk-build.sh <<'EOS'
          set -e
          curl -fsSL -o /tmp/glpk.tar.gz https://ftp.gnu.org/gnu/glpk/glpk-5.0.tar.gz
          tar xzf /tmp/glpk.tar.gz -C /tmp && cd /tmp/glpk-5.0
          CC=emcc AR=emar RANLIB=emranlib ./configure --disable-shared --without-gmp --disable-cplex CFLAGS="-O2 -sWASM_BIGINT" >/dev/null 2>&1
          make -j4 >/dev/null 2>&1
          mkdir -p /tmp/glpk-inc /tmp/glpk-lib
          cp src/glpk.h /tmp/glpk-inc/ && cp src/.libs/libglpk.a /tmp/glpk-lib/
          SYSROOT=$(find /opt -maxdepth 6 -type d -name sysroot 2>/dev/null | head -1)
          echo "sysroot: $SYSROOT"
          cp /tmp/glpk-inc/glpk.h "$SYSROOT/include/"
          cp /tmp/glpk-lib/libglpk.a "$SYSROOT/lib/"
          cp /tmp/glpk-lib/libglpk.a "$SYSROOT/lib/wasm32-emscripten/" 2>/dev/null || true
          cp /tmp/glpk-lib/libglpk.a "$SYSROOT/lib/wasm32-emscripten/pic/" 2>/dev/null || true
          echo "glpk built:" && ls -la /tmp/glpk-lib/
          cd /tmp
          curl -fsSL -o Rglpk.tar.gz https://cran.r-project.org/src/contrib/Rglpk_0.6-5.1.tar.gz
          rm -rf Rglpk && tar xzf Rglpk.tar.gz && cd Rglpk
          # plant the prebuilt wasm GLPK where the vendored fallback expects it
          mkdir -p src/GLPK
          cp /tmp/glpk-lib/libglpk.a src/GLPK/
          cp /tmp/glpk-inc/glpk.h src/GLPK/
          printf 'all:\n\ttrue\n' > src/GLPK/Makefile
          Rscript -e 'webr::install("slam", repos = "https://repo.r-wasm.org", quiet = TRUE)' 2>&1 | tail -1
          # the container's R is NATIVE — the wasm build goes through rwasm::build
          Rscript -e 'rwasm::build("/tmp/Rglpk", out_dir = "/out")' 2>&1 | tail -40
          find /out -name "Rglpk*_R_*.tar.gz" -exec mv {} /out/Rglpk_0.6-5.1.tgz \;
          # --- gemtc (wasm): R deps in the wasm R first (lazy-load executes them),
          # then rjags from our deployed binary repo, then the wasm build
          Rscript -e 'webr::install(c("igraph","meta","plyr","forcats","Matrix","slam","coda"), repos = c("https://repo.r-wasm.org", "https://prolytiq.github.io/r-wasm-pkgs"), quiet = TRUE)' 2>&1 | tail -1
          Rscript -e 'webr::install("rjags", repos = "https://prolytiq.github.io/jags-wasm", quiet = TRUE)' 2>&1 | tail -1
          curl -fsSL -o /tmp/gemtc.tar.gz https://cran.r-project.org/src/contrib/gemtc_1.1-2.tar.gz
          rm -rf /tmp/gemtc && tar xzf /tmp/gemtc.tar.gz -C /tmp
          Rscript -e 'rwasm::build("/tmp/gemtc", out_dir = "/out")' 2>&1 | tail -10
          find /out -name "gemtc*_R_*.tar.gz" -exec mv {} /out/gemtc_1.1-2.tgz \;
          ls -la /out/
          ls -la /out/
          EOS
          sed -i 's/^          //' /tmp/glpk-build.sh
          docker run --rm -v "$PWD/pkgs:/out" -v /tmp/glpk-build.sh:/glpk-build.sh ghcr.io/r-wasm/webr:main bash /glpk-build.sh
      - name: Stage rjags tarball into the workspace (visible inside the build container)
        run: |
          mkdir -p pkgs
          find /tmp/stack -name "rjags*tar.gz" -exec cp {} pkgs/rjags_4-16.tar.gz \;
          ls -la pkgs/
      - name: Assemble the webr binary repo (bin/emscripten/contrib/4.6) + modules
        run: |
          set -euo pipefail
          V=_site/bin/emscripten/contrib/4.6
          sudo mkdir -p $V _site/modules
          # installed-tree tarballs, .tgz (webr's install_tgz format)
          sudo cp pkgs/rjags_4-16_R_x86_64-pc-linux-gnu.tar.gz $V/rjags_4-16.tgz
          sudo cp pkgs/gemtc_1.1-2.tgz $V/gemtc_1.1-2.tgz
          sudo cp pkgs/Rglpk_0.6-5.1.tgz $V/Rglpk_0.6-5.1.tgz
          sudo chown -R $(id -u):$(id -g) _site
          RJ_MD5=$(md5sum $V/rjags_4-16.tgz | cut -d" " -f1)
          GM_MD5=$(md5sum $V/gemtc_1.1-2.tgz | cut -d" " -f1)
          RG_MD5=$(md5sum $V/Rglpk_0.6-5.1.tgz | cut -d" " -f1)
          REPO=https://prolytiq.github.io/jags-wasm/bin/emscripten/contrib/4.6
          cat > $V/PACKAGES <<IDX
          Package: rjags
          Version: 4-16
          Depends: R (>= 3.6.0), coda (>= 0.19-1)
          License: GPL-2
          MD5sum: $RJ_MD5
          Built: R 4.6.0; ; 2026-10-20 00:00:00 UTC; unix
          File: rjags_4-16.tgz
          Repository: $REPO

          Package: Rglpk
          Version: 1.0-4
          Depends: methods, Matrix, slam (>= 0.1-9)
          License: GPL-3
          MD5sum: $RG_MD5
          Built: R 4.6.0; ; 2026-10-21 00:00:00 UTC; unix
          File: Rglpk_0.6-5.1.tgz
          Repository: $REPO

          Package: gemtc
          Version: 1.1-2
          Depends: R (>= 3.5.0), coda (>= 0.13)
          Imports: igraph (>= 1.5), meta (>= 2.1), plyr (>= 1.8), grDevices, graphics, stats, utils, grid, rjags (>= 4-0), Rglpk, forcats (>= 0.5.0)
          Suggests: testthat (>= 0.8), Matrix
          License: GPL-3
          MD5sum: $GM_MD5
          Built: R 4.6.0; ; 2026-10-20 00:00:00 UTC; unix
          File: gemtc_1.1-2.tgz
          Repository: $REPO
          IDX
          # de-indent the heredoc body (YAML block scalar strips nothing)
          sed -i 's/^          //' $V/PACKAGES
          gzip -kf $V/PACKAGES
          sudo find /tmp/stack/jags-wasm-install/lib/jags/modules -name "*.so" -exec cp {} _site/modules/ \;
          # libltdl resolves module names without the lib prefix (basemod.so, glm.so...)
          for f in _site/modules/lib*.so; do
            b=$(basename "$f"); alias="${b#lib}"
            [ "$alias" != "$b" ] && cp "$f" "_site/modules/$alias"
          done
          ls $V _site/modules | head -14
          grep -E "^Package:" $V/PACKAGES
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy-pages:
    needs: deploy-wasm-repo
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
