# Phase 0 spike (issue fts-app#961 discussion): does JAGS cross-compile to wasm
# inside the official webR development container?
name: jags-wasm-spike
on:
  push: { branches: [main] }
  workflow_dispatch: {}

jobs:
  build-libjags:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/r-wasm/webr:main
    steps:
      - name: Toolchain probe
        run: |
          which emcc em++ node
          emcc --version | head -1
          which flang-new || true
          # find the wasm R's Makeconf and print its toolchain lines (source of truth)
          MC=$(ls /opt/R/wasm/lib/R/etc/Makeconf 2>/dev/null || find /opt -name Makeconf -path "*wasm*etc*" 2>/dev/null | head -1)
          echo "Makeconf: $MC"
          grep -E "^(CC|CXX|FC|F77|FLIBS|CFLAGS|CXXFLAGS|FCFLAGS|FFLAGS|LDFLAGS|CPPFLAGS|DYLIB_LD|MAIN_LD|SHLIB_LD) *=" "$MC" || true
      - name: Download JAGS source
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/jags.tar.gz \
            "https://downloads.sourceforge.net/project/mcmc-jags/JAGS/4.x/Source/JAGS-4.3.1.tar.gz"
          tar xzf /tmp/jags.tar.gz -C /tmp
      - name: Refresh autotools config (recognize wasm32-unknown-emscripten)
        run: |
          set -euo pipefail
          # local autoconf copy first (no network flakiness); GNU savannah as fallback
          if [ -f /usr/share/misc/config.sub ]; then
            cp /usr/share/misc/config.sub /tmp/JAGS-4.3.1/config.sub
            cp /usr/share/misc/config.guess /tmp/JAGS-4.3.1/config.guess
          else
            curl -fsSL --retry 3 -o /tmp/JAGS-4.3.1/config.sub "https://raw.githubusercontent.com/gcc-mirror/gcc/master/config.sub"
            curl -fsSL --retry 3 -o /tmp/JAGS-4.3.1/config.guess "https://raw.githubusercontent.com/gcc-mirror/gcc/master/config.guess"
          fi
          grep -q emscripten /tmp/JAGS-4.3.1/config.sub || { echo "config.sub still does not know emscripten"; exit 1; }
      - name: Configure JAGS for emscripten
        working-directory: /tmp/JAGS-4.3.1
        run: |
          set -euo pipefail
          # Actions run: uses a non-login shell — load the container's env profile
          source /etc/profile 2>/dev/null || true
          ls /etc/profile.d/ 2>/dev/null || true
          for f in /etc/profile.d/*.sh; do source "$f" 2>/dev/null || true; done
          env | grep -iE "em|flang|wasm" | head -20 || true
          # lift the whole toolchain out of the WASM R Makeconf (explicit path — the
          # container also has a native R whose Makeconf says gcc; found it the hard way)
          MC=$(ls /opt/R/wasm/lib/R/etc/Makeconf 2>/dev/null || find /opt -name Makeconf -path "*wasm*etc*" 2>/dev/null | head -1)
          test -n "$MC"
          # strip $(MAKE_VAR) tokens — Makeconf flags carry them for R's package builds;
          # outside make, emcc would treat them as input files ("$(LTO): No such file")
          val() { grep -E "^$1 *=" "$MC" | head -1 | sed "s/^$1 *= *//" | sed 's/\$([^)]*)//g' ; }
          export CC="$(val CC)" CXX="$(val CXX)" AR="$(val AR)" RANLIB="$(val RANLIB)"
          # the wasm R Makeconf has no F77 (its Fortran comes prebuilt in libFortranRuntime.a);
          # JAGS must COMPILE Fortran, so point at the container's wasm flang
          export F77="$(val F77)" FC="$(val FC)" FLIBS="$(val FLIBS)"
          if [ -z "$F77" ]; then
            FL=$(find /opt/flang -name "flang-new*" -type f 2>/dev/null | head -1)
            echo "flang binary: $FL"
            if [ -n "$FL" ]; then
              export F77="$FL" FC="$FL"
              export FFLAGS="$(val FFLAGS) -O2 -fwasm-exceptions" FCFLAGS="$(val FCFLAGS) -O2 -fwasm-exceptions"
            fi
          fi
          echo "F77=$F77"
          export CFLAGS="$(val CFLAGS)" CXXFLAGS="$(val CXXFLAGS)" FFLAGS="$(val FFLAGS)" FCFLAGS="$(val FCFLAGS)" LDFLAGS="$(val LDFLAGS)"
          echo "CC=$CC"; echo "F77=$F77"; echo "FLIBS=$FLIBS"
          ./configure --host=wasm32-unknown-emscripten \
            --prefix=/tmp/jags-wasm-install \
            --disable-dependency-tracking \
            --without-blas --without-lapack \
            2>&1 | tee configure.log
      - name: Build
        working-directory: /tmp/JAGS-4.3.1
        run: |
          set -euo pipefail
          make -j2 2>&1 | tee build.log
          make install
      - name: Collect artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jags-wasm-spike-logs
          path: |
            /tmp/JAGS-4.3.1/config.log
            /tmp/JAGS-4.3.1/configure.log
            /tmp/JAGS-4.3.1/build.log
            /tmp/jags-wasm-install/
          if-no-files-found: ignore
